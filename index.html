<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, follow" />
    <title>Auspex Intelligence — Docs</title>
    <meta
      name="description"
      content="Documentation for Auspex Intelligence. Placeholder — coming soon."
    />
    <link rel="canonical" href="https://docs.getauspex.ai/" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Auspex palette — mirrors ax-* tokens in ravenai-site tailwind.config.ts */
        --ax-night: #0e0b1c;
        --ax-violet-deep: #2a1f5c;
        --ax-violet-glow: #8d7bff;
        --ax-mist: #c9ccdd;
        --ax-muted: #8a8fa8;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background:
          radial-gradient(
            100% 80% at 50% 0%,
            var(--ax-violet-deep) 0%,
            var(--ax-night) 70%
          ),
          var(--ax-night);
        color: var(--ax-mist);
        font-family:
          Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
      }
      main {
        max-width: 44rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: var(--ax-violet-glow);
        margin: 0;
      }
      h1 {
        font-family: Fraunces, Georgia, serif;
        font-weight: 700;
        font-size: clamp(2.25rem, 6vw, 4rem);
        line-height: 1.05;
        color: #fff;
        margin: 0;
        text-wrap: balance;
      }
      h1 em {
        font-style: italic;
        color: var(--ax-violet-glow);
      }
      p {
        font-size: 1.125rem;
        line-height: 1.6;
        margin: 0;
        color: var(--ax-mist);
      }
      a {
        color: #fff;
        text-decoration: none;
        border-bottom: 1px solid var(--ax-violet-glow);
        padding-bottom: 2px;
        transition: border-color 0.2s;
      }
      a:hover,
      a:focus-visible {
        border-bottom-color: #fff;
        outline: none;
      }
      footer {
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: var(--ax-muted);
      }
      footer strong {
        color: #fff;
        font-weight: 600;
      }
      footer strong em {
        color: var(--ax-violet-glow);
        font-style: normal;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Auspex Intelligence · Docs</p>
      <h1>Documentation <em>coming soon.</em></h1>
      <p>
        We&rsquo;re preparing the Auspex Intelligence documentation site. In the meantime,
        visit
        <a href="https://getauspex.ai/">getauspex.ai</a>
        or request a briefing at
        <a href="https://getauspex.ai/briefing"
          >getauspex.ai/briefing</a
        >.
      </p>
      <footer>
        <strong>AUSPEX</strong> · © 2026 Auspex Intelligence. All rights reserved.
      </footer>
    </main>
  </body>
</html>
