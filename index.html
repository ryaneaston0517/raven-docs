    <style>
      :root {
        /* Auspex palette — mirrors ax-* tokens in ravenai-site tailwind.config.ts */
        --ax-night: #0e0b1c;
        --ax-violet-deep: #2a1f5c;
        --ax-violet-glow: #8d7bff;
        --ax-mist: #c9ccdd;
        --ax-muted: #8a8fa8;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      body {
        background:
          radial-gradient(
            100% 80% at 50% 0%,
            var(--ax-violet-deep) 0%,
            var(--ax-night) 70%
          ),
          var(--ax-night);
        color: var(--ax-mist);
        font-family:
          Archivo, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 44rem;
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }
      .mark {
        width: auto;
        height: 2.75rem;
        align-self: flex-start;
        color: #fff;
      }
      .eyebrow {
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 0.75rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: var(--ax-violet-glow);
        margin: 0;
      }
      h1 {
        font-weight: 700;
        font-stretch: 125%;
        text-transform: uppercase;
        font-size: clamp(1.5rem, 7vw, 3.75rem);
        line-height: 1.02;
        color: #fff;
        margin: 0;
        text-wrap: balance;
      }
      h1 em {
        font-style: normal;
        color: var(--ax-violet-glow);
      }
      p {
        font-size: 1.125rem;
        line-height: 1.6;
        margin: 0;
        color: var(--ax-mist);
      }
      a {
        color: #fff;
        text-decoration: underline;
        text-decoration-color: var(--ax-violet-glow);
        text-underline-offset: 4px;
        transition: text-decoration-color 0.2s;
      }
      a:hover,
      a:focus-visible {
        text-decoration-color: #fff;
        outline: none;
      }
      footer {
        margin-top: 1.5rem;
        font-size: 0.875rem;
        color: var(--ax-muted);
      }
      footer strong {
        color: #fff;
        font-weight: 700;
        font-stretch: 125%;
        letter-spacing: 0.42em;
      }
      footer strong em {
        color: var(--ax-violet-glow);
        font-style: normal;
      }
    </style>
